<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>upstream-save</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light dark;
  --bg: #fafaf9;
  --fg: #1c1917;
  --muted: #78716c;
  --line: #e7e5e4;
  --panel: #ffffff;
  --accent: #0f766e;
  --accent-bg: #ccfbf1;
  --warn: #b45309;
  --error: #b91c1c;
  font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1917;
    --fg: #e7e5e4;
    --muted: #a8a29e;
    --line: #44403c;
    --panel: #292524;
    --accent: #5eead4;
    --accent-bg: #134e4a;
    --warn: #fbbf24;
    --error: #f87171;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); }
a { color: var(--accent); }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 1.1rem; margin: 0; }
header h1 a { color: inherit; text-decoration: none; }
nav { display: flex; gap: 12px; }
nav a.current { font-weight: bold; text-decoration: none; }
#auth { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.9rem; }
#auth input { width: 12em; min-width: 0; flex: 1 1 8em; }
main { padding: 16px; max-width: 1200px; margin: 0 auto; }
h2 { font-size: 1.05rem; margin: 20px 0 8px; }
input, select, button { font: inherit; color: inherit; }
input, select { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.muted { color: var(--muted); }
.error { color: var(--error); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 12px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; background: var(--panel); }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 0.85rem; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 14em; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
.path { display: inline-flex; flex-wrap: wrap; gap: 2px 4px; }
.path .sep { color: var(--muted); }
.badge { display: inline-block; padding: 0 6px; border-radius: 8px; background: var(--accent-bg); color: var(--accent); font-size: 0.8rem; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.group { margin-bottom: 20px; }
.secondary td { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1><a href="#/">upstream-save</a></h1>
  <nav>
    <a href="#/" id="nav-list">一覧</a>
    <a href="#/compare" id="nav-compare">AS path の比較</a>
  </nav>
  <form id="auth">
    <span id="auth-status" class="muted"></span>
    <input id="token" type="password" placeholder="閲覧用トークン" autocomplete="off">
    <button type="submit">保存</button>
    <button type="button" id="token-clear">消す</button>
  </form>
</header>
<main id="main"></main>
<script src="viewer.js"></script>
</body>
</html>
