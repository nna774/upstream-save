[package]
name = "upstream-save"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.152.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures = "0.3.34"
hex = "0.4.3"
lambda_http = "1.3.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt"] }
